name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/multilang-objectives-homepage-fygoln
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /AOIP

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      # Publishes ./out to the gh-pages branch; GitHub Pages serves it
      # (branch mode is auto-enabled for public repos when the gh-pages
      # branch exists).
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
